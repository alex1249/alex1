<h1>{{ material['title'] }}</h1>
<p>{{ material['date'] }}</p>
<h2>정리본</h2>
<p>{{ material['content'] }}</p>
<h2>원본자료</h2>
<ul>
{% for o in originals %}
  <li><b>{{ o['label'] }}</b>: {{ o['content'] }}</li>
{% endfor %}
</ul>

<h2>원본자료 추가</h2>
<form method="post" action="/materials/{{ material['id'] }}/originals">
  <input type="text" name="label" placeholder="예: 강의자료, 녹음 전사" required><br>
  <textarea name="content" rows="10" cols="60" placeholder="원본 텍스트를 붙여넣으세요"></textarea><br>
  <button type="submit">추가</button>
</form>
